<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>GET LIT 4EVER</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>

<body>
    <div id="overlay"></div>
    <div class="topbar">
        <a href="index.html">
            <img style="width:48px;height:48px;padding:10px;" src="assets/server.jpg">
        </a>

        <div class="text">
            <span class="titletxt" id="typedText"></span>
        </div>

        <div class="navbar">
            <div class="button">
                <a href="projects.html">PROJECTS</a>
            </div>
            <div class="button">
                <a style="color:blue">POSTINGS</a>
            </div>
            <div class="button" style="color: blue;">
                <a href="about.html">ABOUT</a>
            </div>


        </div>
    </div>
    <h1>Blog Posts</h1>
    <ul id="post-list"></ul>

    <script>
        fetch('posts/posts.json')
            .then(response => response.json())
            .then(posts => {
                const list = document.getElementById('post-list');
                // Optional: sort posts by date descending
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                posts.forEach(post => {
                    const li = document.createElement('li');

                    const a = document.createElement('a');
                    a.href = post.url;
                    a.textContent = post.title;
                    a.className = 'title';

                    const meta = document.createElement('div');
                    meta.className = 'meta';
                    meta.textContent = `${post.date} • ${post.author}`;

                    li.appendChild(a);
                    li.appendChild(meta);
                    list.appendChild(li);
                });
            })
            .catch(err => console.error(err));
    </script>

</body>



</html>
